[workspace]
exclude = ["platform/ohos"]
members = [
    "xtask",
    "crates/hex",
    "crates/rules-core",
    "crates/ruleset",
    "crates/sim",
    "crates/ai",
    "crates/net",
    "crates/mcp",
    "crates/cli",
    "crates/client",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.100.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
wasmi = { version = "=2.0.2", default-features = false, features = ["stable", "std", "validate", "deterministic", "portable-dispatch", "prefer-btree-collections"] }
rand_chacha = "=0.9.0"
serde = { version = "=1.0.228", features = ["derive"] }
toml = "=0.9.8"
