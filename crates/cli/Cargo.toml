[package]
name = "histeries-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
heap-profile = ["dep:dhat"]

[dependencies]
histeries-ai = { path = "../ai" }
histeries-mcp = { path = "../mcp" }
histeries-hex = { path = "../hex" }
histeries-rules-core = { path = "../rules-core" }
histeries-ruleset = { path = "../ruleset" }
histeries-sim = { path = "../sim", features = ["extension-files"] }
serde.workspace = true
serde_json = "=1.0.154"

[target.'cfg(any(all(target_os = "linux", not(target_env = "ohos")), target_os = "macos", target_os = "windows"))'.dependencies]
dhat = { version = "=0.3.3", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
histeries-net = { path = "../net" }

[[bin]]
name = "histeries"
path = "src/main.rs"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
http-body-util = "=0.1.3"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tokio = { version = "=1.54.1", features = ["rt", "net", "time"] }
toml.workspace = true
