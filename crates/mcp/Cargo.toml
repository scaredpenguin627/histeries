[package]
name = "histeries-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
histeries-ai = { path = "../ai" }
histeries-rules-core = { path = "../rules-core" }
histeries-sim = { path = "../sim" }
serde_json = "=1.0.154"

axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "=3.11.0", git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "9043cdfa8694d83bf506c2f3eb0313ec173edd7e", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "=1.54.1", features = ["rt", "net"] }
tower = { version = "=0.5.3", features = ["util"] }
