[package]
name = "histeries-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
petgraph = { version = "=0.8.3", default-features = false }
wasmi = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
serde.workspace = true
histeries-hex = { path = "../hex" }
histeries-rules-core = { path = "../rules-core" }
histeries-ruleset = { path = "../ruleset" }

[lib]
path = "src/lib.rs"

[features]
extensions = ["dep:wasmi", "dep:toml"]
extension-files = ["extensions"]

[dev-dependencies]
toml.workspace = true
wasmi.workspace = true
wat = "=1.263.0"

